# JitPack builds the tag you request (https://jitpack.io/#AraujoJordan/medusa) and serves it as
# com.github.AraujoJordan.medusa:<module>:<tag>. The library lives in tools/, so build it from there.
jdk:
  - openjdk21
install:
  - cd tools && ./gradlew publishToMavenLocal -x test -PmedusaVersion="${VERSION:-0.1.0}"
