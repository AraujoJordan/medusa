name: Release

# Push a tag such as v0.1.0 to release. It always creates the GitHub release. It publishes to Maven Central only when the
# repository variable PUBLISH_TO_CENTRAL is "true" (set it after the one-time setup in RELEASING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Version from the tag
        run: echo "MEDUSA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test
        working-directory: tools
        run: ./gradlew test --no-daemon -PmedusaVersion="$MEDUSA_VERSION"
      - name: Publish to Maven Central
        if: vars.PUBLISH_TO_CENTRAL == 'true'
        working-directory: tools
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --no-daemon -PmedusaVersion="$MEDUSA_VERSION"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
